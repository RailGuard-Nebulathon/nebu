substitutions:
  _API_URL: https://railguard-api-325339213051.asia-southeast1.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - web/frontend/Dockerfile
      - --build-arg
      - VITE_API_URL=${_API_URL}
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/railguard/railguard-web:latest
      - .

images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/railguard/railguard-web:latest

options:
  logging: CLOUD_LOGGING_ONLY
