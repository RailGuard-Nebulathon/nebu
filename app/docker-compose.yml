services:
  api:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs:ro

  web:
    build:
      context: .
      dockerfile: web/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
