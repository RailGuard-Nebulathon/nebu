project:
  name: railguard
  seed: 42
paths:
  data_root: data
  raw_root: data/raw
  processed_root: data/processed
  manifest_root: data/manifests
  output_root: outputs
runtime:
  device: auto
  num_workers: 0
  deterministic: true
logging:
  level: INFO
training:
  epochs: 100
  batch_size: 32
  early_stopping_patience: 12
  learning_rate: 0.001
  weight_decay: 0.0001
evaluation:
  bootstrap_samples: 1000
  calibration_bins: 10
robustness:
  enabled: false
  gaussian_noise: {severity: [0.01, 0.03, 0.05]}
  random_point_dropout: {severity: [0.05, 0.10, 0.20]}
health:
  weights: {fault: 0.5, damage: 0.3, anomaly: 0.2, conservative_prior: 0.5}
  thresholds: {healthy: 80, monitor: 60, inspect_soon: 35}
submission:
  door: {template: null, id_column: null, prediction_column: prediction}
  acv: {template: null, id_column: file_id, prediction_column: ranked_cars}
  corrugation: {template: null, id_column: file_id, prediction_column: prediction}
  shm: {template: null, id_column: file_id, prediction_column: prediction}
